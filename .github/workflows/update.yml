name: Update Fyrisbiografen calendar

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: node scrape.js

      - name: Commit and push if the calendar changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fyrisbiografen.ics
          if ! git diff --staged --quiet; then
            echo "Changes detected, committing..."
            git commit -m "Update calendar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Fetching latest from remote..."
            git fetch origin main
            echo "Rebasing on origin/main..."
            git rebase -Xtheirs origin/main
            echo "Pushing to origin/main..."
            git push origin main
          else
            echo "No changes to commit"
          fi
