name: Update Fyrisbiografen calendar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scrape.js
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const newContent = fs.readFileSync('docs/fyrisbiografen.ics', 'utf8');

            try {
              const { data: currentFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/fyrisbiografen.ics',
                ref: 'main',
              });

              const currentContent = Buffer.from(currentFile.content, 'base64').toString();

              if (newContent === currentContent) {
                console.log('No changes to calendar');
                return;
              }

              console.log('Calendar changed, updating...');

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/fyrisbiografen.ics',
                message: `Update calendar ${new Date().toISOString()}`,
                content: Buffer.from(newContent).toString('base64'),
                sha: currentFile.sha,
                branch: 'main',
              });

              console.log('Calendar updated successfully');
            } catch (err) {
              if (err.status === 404) {
                console.log('File does not exist, creating...');
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'docs/fyrisbiografen.ics',
                  message: `Create calendar ${new Date().toISOString()}`,
                  content: Buffer.from(newContent).toString('base64'),
                  branch: 'main',
                });
                console.log('Calendar created successfully');
              } else {
                throw err;
              }
            }
