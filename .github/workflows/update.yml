name: Update Fyrisbiografen calendar

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: node scrape.js

      - name: Commit and push if the calendar changed via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the calendar file exists and is different
          NEW_CONTENT=$(cat docs/fyrisbiografen.ics)

          # Get the current file from the repo
          CURRENT=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/docs/fyrisbiografen.ics?ref=main" \
            | jq -r '.content' | base64 -d 2>/dev/null || echo "")

          # Compare and commit if different
          if [ "$NEW_CONTENT" != "$CURRENT" ]; then
            echo "Calendar changed, committing via API..."

            # Get the current commit SHA
            SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/docs/fyrisbiografen.ics?ref=main" \
              | jq -r '.sha' 2>/dev/null || echo "")

            # Encode the new content to base64
            ENCODED=$(echo "$NEW_CONTENT" | base64)

            # Prepare the JSON payload
            PAYLOAD=$(jq -n \
              --arg message "Update calendar $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg content "$ENCODED" \
              --arg sha "$SHA" \
              '{message: $message, content: $content, sha: $sha, branch: "main"}')

            # Commit the file
            curl -X PUT \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/${{ github.repository }}/contents/docs/fyrisbiografen.ics"
          else
            echo "Calendar unchanged, skipping commit"
          fi
