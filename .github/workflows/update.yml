name: Update Fyrisbiografen calendar

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: node scrape.js

      - name: Commit and push if the calendar changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fyrisbiografen.ics
          if ! git diff --staged --quiet; then
            git commit -m "Update calendar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
