name: Sync Calendar Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: node scrape.js
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            console.log('Reading generated calendar...');
            const filePath = path.join(process.env.GITHUB_WORKSPACE, 'docs/fyrisbiografen.ics');
            const newContent = fs.readFileSync(filePath, 'utf8');
            console.log(`Calendar size: ${newContent.length} bytes`);

            try {
              console.log('Fetching current file from GitHub...');
              const { data: currentFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/fyrisbiografen.ics',
                ref: 'main',
              });

              const currentContent = Buffer.from(currentFile.content, 'base64').toString();

              if (newContent === currentContent) {
                console.log('Calendar is up-to-date, no changes needed');
                return;
              }

              console.log('Calendar has changed, updating...');
              const timestamp = new Date().toISOString();

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/fyrisbiografen.ics',
                message: `Update calendar ${timestamp}`,
                content: Buffer.from(newContent).toString('base64'),
                sha: currentFile.sha,
                branch: 'main',
              });

              console.log('✓ Calendar updated successfully');
            } catch (err) {
              if (err.status === 404) {
                console.log('Calendar file does not exist, creating...');
                const timestamp = new Date().toISOString();

                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'docs/fyrisbiografen.ics',
                  message: `Create calendar ${timestamp}`,
                  content: Buffer.from(newContent).toString('base64'),
                  branch: 'main',
                });

                console.log('✓ Calendar created successfully');
              } else {
                console.error('Error:', err);
                throw err;
              }
            }
